services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "false"
      ALLOW_INSECURE_LOCAL_DEV: "false"
      CORS_ALLOWED_ORIGINS: ""
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "5001"
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    env_file:
      - .env
    ports:
      # Local-machine access only. Put a separately managed HTTPS gateway in
      # front if remote access is required; never publish backend:5001.
      - "127.0.0.1:3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
